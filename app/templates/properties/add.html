{% extends 'base.html' %}

{% block title %}Add Property - Real Estate Management{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Add New Property</h1>
        <a href="{{ url_for('properties.list_properties') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Properties
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" action="{{ url_for('properties.add_property') }}">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="property_type" class="form-label">Property Type*</label>
                        <select name="property_type" id="property_type" class="form-select" required>
                            <option value="">Select Type</option>
                            <option value="house">House</option>
                            <option value="apartment">Apartment</option>
                            <option value="commercial">Commercial</option>
                            <option value="land">Land</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="owner_id" class="form-label">Owner*</label>
                        <select name="owner_id" id="owner_id" class="form-select" required>
                            <option value="">Select Owner</option>
                            {% for owner in owners %}
                                <option value="{{ owner.owner_id }}">{{ owner.first_name }} {{ owner.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="address" class="form-label">Address*</label>
                        <input type="text" name="address" id="address" class="form-control" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="city" class="form-label">City*</label>
                        <input type="text" name="city" id="city" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="state" class="form-label">State*</label>
                        <input type="text" name="state" id="state" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label for="postal_code" class="form-label">Postal Code*</label>
                        <input type="text" name="postal_code" id="postal_code" class="form-control" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="country" class="form-label">Country</label>
                        <input type="text" name="country" id="country" class="form-control" value="USA">
                    </div>
                    <div class="col-md-4">
                        <label for="size_sqft" class="form-label">Size (sq ft)*</label>
                        <input type="number" name="size_sqft" id="size_sqft" class="form-control" step="0.01" min="0" required>
                    </div>
                    <div class="col-md-4">
                        <label for="year_built" class="form-label">Year Built</label>
                        <input type="number" name="year_built" id="year_built" class="form-control" min="1800" max="2100">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="num_bedrooms" class="form-label">Bedrooms</label>
                        <input type="number" name="num_bedrooms" id="num_bedrooms" class="form-control" min="0">
                    </div>
                    <div class="col-md-4">
                        <label for="num_bathrooms" class="form-label">Bathrooms</label>
                        <input type="number" name="num_bathrooms" id="num_bathrooms" class="form-control" step="0.5" min="0">
                    </div>
                    <div class="col-md-4">
                        <label for="listing_price" class="form-label">Listing Price (₹)</label>
                        <input type="number" name="listing_price" id="listing_price" class="form-control" step="0.01" min="0">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="listing_status" class="form-label">Listing Status*</label>
                        <select name="listing_status" id="listing_status" class="form-select" required>
                            <option value="available">Available</option>
                            <option value="leased">Leased</option>
                            <option value="sold">Sold</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <label for="description" class="form-label">Description</label>
                        <textarea name="description" id="description" class="form-control" rows="4"></textarea>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="reset" class="btn btn-outline-secondary">Clear Form</button>
                    <button type="submit" class="btn btn-primary">Add Property</button>
                </div>
            </form>
        </div>
        <div class="card-footer">
            <small class="text-muted">* Required fields</small>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Add Lease - Real Estate Management{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Add New Lease</h1>
        <a href="{{ url_for('leases.list_leases') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Leases
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" action="{{ url_for('leases.add_lease') }}">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="property_id" class="form-label">Property*</label>
                        <select name="property_id" id="property_id" class="form-select" required>
                            <option value="">Select Property</option>
                            {% for property in properties %}
                                <option value="{{ property.property_id }}">
                                    {{ property.address }} ({{ property.property_type|capitalize }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="tenant_id" class="form-label">Tenant*</label>
                        <select name="tenant_id" id="tenant_id" class="form-select" required>
                            <option value="">Select Tenant</option>
                            {% for tenant in tenants %}
                                <option value="{{ tenant.tenant_id }}">
                                    {{ tenant.first_name }} {{ tenant.last_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="start_date" class="form-label">Start Date*</label>
                        <input type="date" name="start_date" id="start_date" class="form-control" value="{{ today }}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="end_date" class="form-label">End Date*</label>
                        <input type="date" name="end_date" id="end_date" class="form-control" value="{{ next_year }}" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="monthly_rent" class="form-label">Monthly Rent (₹)*</label>
                        <input type="number" name="monthly_rent" id="monthly_rent" class="form-control" min="0" step="0.01" required>
                    </div>
                    <div class="col-md-6">
                        <label for="security_deposit" class="form-label">Security Deposit (₹)*</label>
                        <input type="number" name="security_deposit" id="security_deposit" class="form-control" min="0" step="0.01" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="payment_due_day" class="form-label">Payment Due Day*</label>
                        <input type="number" name="payment_due_day" id="payment_due_day" class="form-control" min="1" max="31" value="1" required>
                    </div>
                    <div class="col-md-6">
                        <label for="lease_status" class="form-label">Lease Status*</label>
                        <select name="lease_status" id="lease_status" class="form-select" required>
                            <option value="active" selected>Active</option>
                            <option value="expired">Expired</option>
                            <option value="terminated">Terminated</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="reset" class="btn btn-outline-secondary">Clear Form</button>
                    <button type="submit" class="btn btn-warning">Create Lease</button>
                </div>
            </form>
        </div>
        <div class="card-footer">
            <small class="text-muted">* Required fields</small>
        </div>
    </div>
</div>
{% endblock %}
